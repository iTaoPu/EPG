name: EPG
# 每天00:40 10:15 15:00 18:30更新 (UTC+8)
on:
  schedule:
    - cron: '40 16 * * *'  # 00:40 UTC+8 (16:40 UTC)
    - cron: '15 02 * * *'  # 10:15 UTC+8 (02:15 UTC)
    - cron: '00 07 * * *'  # 15:00 UTC+8 (07:00 UTC)
    - cron: '30 10 * * *'  # 18:30 UTC+8 (10:30 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: https://raw.githubusercontent.com/sparkssssssssss/epg/main/pp.xml.gz
            branch: 112114
            sleep: 0
          #- url: https://raw.githubusercontent.com/kuke31/xmlgz/main/e.xml.gz
          #  分支: erw
          #  sleep: 30
          # - url: http://epg.51zmt.top:8000/e.xml
          #   branch: 51zmt
          #   sleep: 60

    steps:
      - name: Download files
        run: |
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ matrix.branch }}/md5.txt -O md5.txt
          url="${{ matrix.url }}"
          if [[ "$url" == *".gz" ]]; then
            echo "URL ends with .gz"
            wget "$url" -O e.xml.gz
            gzip -df e.xml.gz
          else
            echo "URL doesn't end with .gz"
            wget "$url" -O e.xml
          fi

      - name: Check MD5
        run: |
          md5=$(md5sum ./e.xml | awk '{print $1}')
          if ! grep -q "$md5" ./md5.txt; then
            echo "isDiff=$md5" >> $GITHUB_ENV
            now_time=$(date -u -d '+8 hour' '+%Y-%m-%d %H:%M:%S')
            echo "now_time=$now_time" >> $GITHUB_ENV
            tag=$(date -u -d '+8 hour' '+%Y.%m.%d')
            echo "tag=$tag" >> $GITHUB_ENV
          fi

      - name: Checkout code
        if: ${{ env.isDiff }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: epg

      - name: Set up Python
        if: ${{ env.isDiff }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert XML to JSON
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mkdir -p ./xml ./json
          mv -f ../e.xml ./xml/e.xml
          pip install -r requirements.txt
          python xml2json.py

      - name: Move and rename files
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mv -f ./xml/e.xml ./xml/${{ matrix.branch }}.xml
          mv -f ./json/e.json ./json/${{ matrix.branch }}.json
          echo "${{ env.isDiff }}" > ./md5.txt
          sleep ${{ matrix.sleep }}

      - name: Create release
        if: ${{ env.isDiff }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          body: "更新时间: ${{ env.now_time }}"
          allowUpdates: true
          artifacts: |
            epg/xml/*.xml
            epg/json/*.json

      - name: Commit changes
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "2c * 更新时间: ${{ env.now_time }}" README.md
          git add --all
          git commit -m "${{ env.now_time }}"
          git push -f origin ${{ matrix.branch }}
